<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlogNeo — Connected</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap" style="padding:40px 16px">
  <div class="card">
    <h2>BlogNeo — OAuth callback</h2>
    <p id="msg">Checking the result…</p>
    <p class="small muted">In BlogNeo v2 the OAuth callback is handled by the BlogNeo API server, which redirects you back to the BlogNeo home page with the connection result. This page is kept only as a fallback landing page.</p>
    <a class="btn" href="index.html">← Back to BlogNeo</a>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search);
const el = document.getElementById('msg');
if (q.get('code')) el.textContent = 'An authorization code was received, but this page is not the callback any more — please start again from BlogNeo → Connections (the API server handles the exchange).';
else if (q.get('error')) el.textContent = 'Authorization was not completed: ' + q.get('error') + '. Please try again from Connections.';
else el.textContent = 'No authorization code in this URL. Please start again from BlogNeo → Connections.';
</script>
</body>
</html>
